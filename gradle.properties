# -Dfile.encoding=UTF-8 : les messages de build de ce projet sont en francais et
# passent par des consoles Windows dont la page de code par defaut n'est pas UTF-8.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
# R generee par module plutot qu'une R globale : c'est ce qui rend le decoupage
# en modules rentable a la compilation.
android.nonTransitiveRClass=true

kotlin.code.style=official
